<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/ngl@2.3.1/dist/ngl.js"></script>
</head>
<body style="margin:0; background:#1a1a2e;">
  <div id="viewport" style="width:100vw; height:100vh;"></div>
  <script>
    var stage = new NGL.Stage("viewport", {backgroundColor: "#1a1a2e"});
    stage.loadFile("protein.pdb", {defaultRepresentation: false}).then(function(o) {
      o.addRepresentation("cartoon", {color: "chainid"});
    });
    stage.loadFile("ligand.pdb", {defaultRepresentation: false}).then(function(o) {
      o.addRepresentation("ball+stick", {color: "element"});
    });
    stage.loadFile("site.pdb", {defaultRepresentation: false}).then(function(o) {
      o.addRepresentation("spacefill", {color: "red", opacity: 0.4});
    });
    stage.autoView();
  </script>
</body>
</html>
