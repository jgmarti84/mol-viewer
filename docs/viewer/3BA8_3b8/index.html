<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1A52 Pocket Viewer</title>
  <script src="https://unpkg.com/ngl@2.3.1/dist/ngl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #viewport { flex: 1; }
    #panel {
      width: 190px; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      padding: 16px 14px; display: flex; flex-direction: column; gap: 14px;
      border-left: 1px solid rgba(255,255,255,0.08); z-index: 10;
    }
    #panel h3 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2px; }
    .layer { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; opacity: 0.9; }
    input[type=checkbox] { cursor: pointer; accent-color: #7b8fff; }
    label { cursor: pointer; user-select: none; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); }
    #status { font-size: 11px; color: #666; margin-top: auto; }
    .slider-row { display: flex; align-items: center; gap: 6px; padding-left: 20px; }
    .slider-row input[type=range] { flex: 1; cursor: pointer; accent-color: #7b8fff; height: 3px; }
    .slider-val { font-size: 11px; color: #999; width: 26px; text-align: right; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="panel">
    <h3>Layers</h3>

    <div class="layer">
      <div class="dot" style="background:#5c7fd4;"></div>
      <input type="checkbox" id="cb-protein" checked>
      <label for="cb-protein">Protein</label>
    </div>
    <div class="layer">
      <div class="dot" style="background:#cccccc;"></div>
      <input type="checkbox" id="cb-ligand" checked>
      <label for="cb-ligand">Ligand</label>
    </div>

    <hr class="divider">
    <h3>Pockets</h3>

    <div class="layer">
      <div class="dot" style="background:#f5a623;"></div>
      <input type="checkbox" id="cb-hyd" checked>
      <label for="cb-hyd">Hydrophobic (HYD)</label>
    </div>
    <div class="slider-row">
      <input type="range" id="sl-hyd" min="0.5" max="6" step="0.1" value="0.5">
      <span class="slider-val" id="sv-hyd">0.5</span>
    </div>

    <div class="layer">
      <div class="dot" style="background:#4a90e2;"></div>
      <input type="checkbox" id="cb-don" checked>
      <label for="cb-don">Donor (DON)</label>
    </div>
    <div class="slider-row">
      <input type="range" id="sl-don" min="0.5" max="6" step="0.1" value="0.2">
      <span class="slider-val" id="sv-don">0.2</span>
    </div>

    <div class="layer">
      <div class="dot" style="background:#e05c5c;"></div>
      <input type="checkbox" id="cb-acc" checked>
      <label for="cb-acc">Acceptor (ACC)</label>
    </div>
    <div class="slider-row">
      <input type="range" id="sl-acc" min="0.5" max="6" step="0.1" value="0.2">
      <span class="slider-val" id="sv-acc">0.2</span>
    </div>
    <div class="layer">
      <input type="checkbox" id="cb-labels" checked>
      <label for="cb-labels">Pocket labels</label>
    </div>

    <div id="status">Loading…</div>
  </div>

  <script>
    var stage = new NGL.Stage("viewport", { backgroundColor: "#1a1a2e" });

    window.addEventListener("resize", function () { stage.handleResize(); });

    Promise.all([
      stage.loadFile("protein.pdb", { defaultRepresentation: false }),
      stage.loadFile("ligand.pdb",  { defaultRepresentation: false }),
      stage.loadFile("pockets.pdb", { defaultRepresentation: false })
    ]).then(function (results) {
      var protein = results[0];
      var ligand  = results[1];
      var pockets = results[2];

      // Protein — cartoon colored by chain
      protein.addRepresentation("cartoon", { color: "chainid" });

      // Ligand — ball+stick
      ligand.addRepresentation("ball+stick", { color: "element" });

      // Pockets — three residue types with separate colors
      // NGL residue-name selector syntax: [NAME]
      var repHyd = pockets.addRepresentation("spacefill", {
        sele: "[HYD]",
        color: "#f5a623",
        opacity: 0.55,
        radiusScale: 0.5   // ~4.8 Å — pocket center
      });
      var repDon = pockets.addRepresentation("spacefill", {
        sele: "[DON]",
        color: "#4a90e2",
        opacity: 0.45,
        radiusScale: 0.2
      });
      var repAcc = pockets.addRepresentation("spacefill", {
        sele: "[ACC]",
        color: "#e05c5c",
        opacity: 0.45,
        radiusScale: 0.2
      });

      // Labels — pocket rank (residue number) on HYD atoms only
      var repLabels = pockets.addRepresentation("label", {
        sele: "[HYD]",
        labelType: "resno",
        color: "white",
        fontSize: 2.2,
        fontWeight: "bold",
        showBackground: true,
        backgroundColor: "black",
        backgroundOpacity: 0.55
      });

      stage.autoView();
      document.getElementById("status").textContent = "1A52 · EST";

      // Toggle controls
      function bindComp(id, comp) {
        document.getElementById(id).addEventListener("change", function (e) {
          comp.setVisibility(e.target.checked);
        });
      }
      function bindRep(id, rep) {
        document.getElementById(id).addEventListener("change", function (e) {
          rep.setVisibility(e.target.checked);
        });
      }

      bindComp("cb-protein", protein);
      bindComp("cb-ligand",  ligand);
      bindRep("cb-hyd",      repHyd);
      bindRep("cb-don",      repDon);
      bindRep("cb-acc",      repAcc);
      bindRep("cb-labels",   repLabels);

      function bindSlider(sliderId, valId, rep) {
        var slider = document.getElementById(sliderId);
        var valEl  = document.getElementById(valId);
        slider.addEventListener("input", function () {
          var v = parseFloat(slider.value);
          valEl.textContent = v.toFixed(1);
          rep.setParameters({ radiusScale: v });
        });
      }

      bindSlider("sl-hyd", "sv-hyd", repHyd);
      bindSlider("sl-don", "sv-don", repDon);
      bindSlider("sl-acc", "sv-acc", repAcc);
    }).catch(function (err) {
      document.getElementById("status").textContent = "Error: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
